name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
