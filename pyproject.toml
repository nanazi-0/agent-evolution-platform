[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolution-platform"
version = "0.1.0"
description = "Governed, evaluation-driven RSI for agent prompts, skills, memory rules, and harness artifacts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evolutionctl = "agent_evolution.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

